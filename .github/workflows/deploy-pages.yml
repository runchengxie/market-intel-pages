name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_summary:
        description: Regenerate the latest daily note even if one already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site artifact
        env:
          SITE_OUTPUT: ${{ runner.temp }}/market-intel-pages-site
        run: python3 scripts/build_site.py --output "$SITE_OUTPUT"
      - name: Generate latest daily note
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          SITE_OUTPUT: ${{ runner.temp }}/market-intel-pages-site
        run: |
          force_flag=""
          if [ "${{ inputs.force_summary }}" = "true" ]; then force_flag="--force"; fi
          python3 scripts/generate_daily_summary.py --reports data/reports.json --summaries data/daily_summaries.json --history-url '${{ steps.pages.outputs.base_url }}/data/daily_summaries.json' --output "$SITE_OUTPUT/data/daily_summaries.json" $force_flag
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/market-intel-pages-site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
